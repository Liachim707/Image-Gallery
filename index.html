<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Image Gallery</title>

    <link rel="stylesheet" href="index.css" />
    <script src="index.js" defer></script>
  </head>

  <body>
    <h1>Image Gallery</h1>

    <main class="container">
      <!-- Большое выбранное изображение -->
      <section class="preview">
        <img id="main-image" src="" alt="Selected image" />

        <p class="author">Author: <b id="author-name">Loading...</b></p>
      </section>

      <!-- Миниатюры изображений -->
      <section class="gallery" id="gallery"></section>

      <!-- Кнопки управления -->
      <div class="controls">
        <button id="new-images" type="button">NEW</button>

        <button id="timer-button" type="button">STOP</button>
      </div>

      <p id="status" class="status" aria-live="polite">Loading images...</p>
    </main>
  </body>
</html>
